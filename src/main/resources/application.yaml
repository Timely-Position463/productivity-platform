server:
  port: 8080

spring:
  application:
    name: productivity

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 100MB

  datasource:

    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: true


logging:
  level:
    org.springframework.security: info
    org.hibernate.SQL: info


jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

