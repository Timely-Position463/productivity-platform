server:
  port: 8080

spring:
  application:
    name: productivity

  datasource:

    url: jdbc:postgresql://localhost:5432/productivity_platform
    username: ${DB_USER}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        jdbc:
          timezone: Asia/Kolkata

logging:
  level:
    org.springframework.security: debug
    org.hibernate.SQL: debug


jwt:
  secret: ${JWT_SECRET}
  expiration: 3600000

